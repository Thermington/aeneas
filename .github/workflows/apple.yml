name: apple
# macOS minutes are only spent when Apple code changes (paths filter) or on a manual run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
jobs:
  apple:
    # Only in the public repository, where Actions minutes are free. The private one is checked before each push from
    # the development Mac instead (tools/check-all.mjs, run by tools/githooks/pre-push).
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: swift test (EACore)
        working-directory: apple/Packages/EACore
        run: swift test
